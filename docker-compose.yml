version: '3.8'
services:
  db:
    image: 192.168.33.10:8083/mongo:4.2
    container_name: db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db

  app:
    image: ${DOCKER_IMAGE}
    container_name: foodwaste-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_HOST: "mongodb://db:27017"
      DB_NAME: "foodWasteDB"
    depends_on:
      - db

volumes:
  mongo-data:
